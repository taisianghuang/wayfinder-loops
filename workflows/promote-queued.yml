name: promote-queued

# When an issue closes as completed, promote its dependents:
# agent:queued -> agent:implement once every blocker is closed.
# Sub-issues are refused (agent:blocked) - decision tickets are never auto-promoted.
# A ticket labeled agent:queued is checked immediately, so frontier tickets
# (zero blockers at creation) are promoted without waiting for a close event.
# workflow_dispatch re-sweeps every open agent:queued issue in this repo
# (recovers from missed events, e.g. a dependency added after its blocker closed).

on:
  issues:
    types: [closed, labeled]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'closed' && github.event.issue.state_reason == 'completed') ||
      (github.event.action == 'labeled' && github.event.label.name == 'agent:queued')
    runs-on: ubuntu-latest
    steps:
      - name: Promote unblocked dependents
        env:
          # ORG_AUTOMATION_TOKEN (classic PAT, repo scope) is only needed when a
          # dependency crosses repos; same-repo promotion works with github.token.
          GH_TOKEN: ${{ secrets.ORG_AUTOMATION_TOKEN || github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ "$EVENT" = "workflow_dispatch" ]; then
            candidates=$(gh api "repos/$REPO/issues?labels=agent%3Aqueued&state=open&per_page=100" --paginate --jq '.[].url')
          elif [ "$ACTION" = "labeled" ]; then
            # Ticket creators wire blocked-by right after creation; give that a moment
            # so a not-yet-wired ticket is not mistaken for a frontier ticket.
            sleep 45
            candidates="https://api.github.com/repos/$REPO/issues/$ISSUE_NUM"
          else
            candidates=$(gh api "repos/$REPO/issues/$ISSUE_NUM/dependencies/blocking?per_page=100" --paginate --jq '.[].url')
          fi

          for url in $candidates; do
            issue=$(gh api "$url")
            state=$(jq -r '.state' <<<"$issue")
            queued=$(jq -r '[.labels[].name] | index("agent:queued") != null' <<<"$issue")
            [ "$state" = "open" ] && [ "$queued" = "true" ] || continue

            owner=$(sed -E 's#.*/repos/([^/]+)/([^/]+)/issues/([0-9]+)$#\1#' <<<"$url")
            name=$(sed -E 's#.*/repos/([^/]+)/([^/]+)/issues/([0-9]+)$#\2#' <<<"$url")
            num=$(sed -E 's#.*/repos/([^/]+)/([^/]+)/issues/([0-9]+)$#\3#' <<<"$url")

            parent=$(gh api graphql \
              -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){issue(number:$n){parent{number}}}}' \
              -f o="$owner" -f r="$name" -F n="$num" --jq '.data.repository.issue.parent.number // empty')

            if [ -n "$parent" ]; then
              gh issue edit "$num" --repo "$owner/$name" --remove-label "agent:queued" --add-label "agent:blocked"
              gh issue comment "$num" --repo "$owner/$name" --body \
                "🤖 [promote-queued] Refused to auto-promote: this is a sub-issue of #$parent. Sub-issues are decision/decomposition artifacts, not implementation tickets. Remove the parent link or promote manually."
              continue
            fi

            open_blockers=$(gh api "repos/$owner/$name/issues/$num/dependencies/blocked_by?per_page=100" --paginate \
              --jq '[.[] | select(.state == "open")] | length')

            if [ "$open_blockers" -eq 0 ]; then
              gh issue edit "$num" --repo "$owner/$name" --remove-label "agent:queued" --add-label "agent:implement"
              gh issue comment "$num" --repo "$owner/$name" --body \
                "🤖 [promote-queued] All blockers closed - promoted to \`agent:implement\`. The implementer loop will pick this up."
            fi
          done
